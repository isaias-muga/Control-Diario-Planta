<h2 mat-dialog-title>{{ data.titulo }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
  <mat-dialog-content>
    <div class="content">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ data.etiqueta }}</mat-label>
        <input
          matInput
          id="valor"
          type="password"
          formControlName="valor"
          autocomplete="off"
          [attr.inputmode]="esPin ? 'numeric' : null"
          [attr.maxlength]="esPin ? 4 : null"
          cdkFocusInitial
        />
        @if (form.controls.valor.touched && form.controls.valor.invalid) {
          <mat-error>{{ mensajeValidacion }}</mat-error>
        }
      </mat-form-field>
      @if (data.ayuda) {
        <p class="ayuda">{{ data.ayuda }}</p>
      }

      @if (saveError()) {
        <p class="form-error" role="alert">{{ saveError() }}</p>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="saving()">
      {{ saving() ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
