name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DairyControl.slnx

      - name: Build
        run: dotnet build DairyControl.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution DairyControl.slnx --no-build --configuration Release

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --no-watch

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets for this run only; nothing here is a real credential.
      - name: Create .env
        run: |
          {
            echo "MSSQL_SA_PASSWORD=Ci_$(openssl rand -hex 12)_aA1"
            echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "PIN_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API health
        run: curl --fail --silent --show-error --retry 90 --retry-delay 2 --retry-all-errors --retry-connrefused http://localhost:8080/health

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      # The race detector: CI is slower than a developer machine, and a test that acts on a control before its data has arrived passes by
      # luck. Every /api response is delayed; add here the specs of any flow that loads data when its page opens (see CLAUDE.md, E2E tests).
      - name: Run the data-loading flows with a slow API
        working-directory: e2e
        env:
          E2E_API_LATENCY_MS: "400"
        run: npx playwright test carga-rapida roles correcciones cuentas-protegidas

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      # The API warnings and errors first (the full logs are long), then everything, folded
      - name: Compose logs
        if: failure()
        run: |
          echo "=== api: warnings, errors and exceptions ==="
          docker compose logs --no-color api | grep -E "(warn|fail|crit):|Exception" -A4 || echo "(none)"
          echo "::group::Full compose logs"
          docker compose logs --no-color
          echo "::endgroup::"

      - name: Stop the stack
        if: always()
        run: docker compose down -v
